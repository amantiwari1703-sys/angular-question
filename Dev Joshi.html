<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
<body ng-app>
    <div ng-init="items=['Shirt','Shoes','Watch'];total=5500">
        <h1>Shopping Details</h1>
        Customer Name:
        <input type="text" ng-model="Customer">
        <br><br>
       <button ng-click="bill='Bill Generated'">
        Generate Bill
       </button> 
       <h2>{{bill}}</h2>
       <h2>{{customer |uppercase}}</h2>
       <h2>{{total |currency:'₹'}}</h2>
       <ul>
        <li ng-repeat="i in items">
            {{i |uppercase}}
        </li>
       </ul>
       <p ng-show="true">
        Shopping Completed
       </p>

    </div>
    
</body>
</html>
